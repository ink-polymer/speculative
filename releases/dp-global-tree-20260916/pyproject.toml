[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "global-tree-budget-dp"
version = "0.1.0"
description = "Frozen heterogeneous global tree-budget DP diagnostic release"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {text = "MIT"}
dependencies = [
    "transformers==4.57.1",
    "accelerate>=1.0,<2.0",
    "datasets>=2.20,<4.0",
    "huggingface-hub>=0.34,<1.0",
    "sacrebleu>=2.4,<3.0",
    "safetensors>=0.4",
    "numpy>=1.24",
    "tqdm>=4.66",
    "typing-extensions>=4.10",
]

[project.optional-dependencies]
test = ["pytest>=7.4", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
